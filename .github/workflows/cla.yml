name: cla

# A pull request from anyone but the maintainer needs a signed CLA. Kiln is
# AGPL-3.0, and the agreement is what lets the maintainer relicense a
# contribution later; without it every outside line stays AGPL-only for the
# maintainer too. Signatures land on the cla-signatures branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/alternayte/kiln/blob/main/CLA.md
          branch: cla-signatures
          allowlist: AlterNayte,alternayte,dependabot[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Kiln needs a signed contributor
            licence agreement before it can be merged. Read the agreement and
            comment the sentence below to sign it; the bot records it once.
