name: kvm

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v2
      - run: just check
      - run: just gate P0
      - run: sudo env "PATH=$PATH" bash scripts/dev-env.sh
      - run: sudo env "PATH=$PATH" go run ./cmd/kiln init
      - run: sudo env "PATH=$PATH" just gate P1
      - run: sudo env "PATH=$PATH" just gate P2
      - run: sudo env "PATH=$PATH" just gate P3
      - run: sudo env "PATH=$PATH" just gate P4
      - run: sudo env "PATH=$PATH" just gate P5
