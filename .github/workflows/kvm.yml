name: kvm

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v2
      - run: just check

  gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [P0, P1, P2, P3, P4, P5, sec]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v2
      - run: sudo env "PATH=$PATH" bash scripts/dev-env.sh
      - run: sudo env "PATH=$PATH" go run ./cmd/kiln init
      # Docker sets the FORWARD policy to DROP. Kiln's chains are in the inet
      # family at the same priority and are registered later, so Docker's
      # policy would drop guest traffic before Kiln's chain sees it. The reply
      # arrives on the uplink, so both directions need a rule.
      - run: sudo iptables -I FORWARD 1 -i 'kiln-+' -j ACCEPT
      - run: sudo iptables -I FORWARD 1 -o 'kiln-+' -j ACCEPT
      - run: sudo env "PATH=$PATH" just gate ${{ matrix.gate }}
