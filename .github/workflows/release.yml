name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # A release binary is the one thing people run without reading the code, so
  # a tag that skipped the gates could ship a kilnd that never booted a
  # microVM. Nothing publishes until these pass.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: just check

  gate:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [P0, P1, P2, P3, P4, P5, sec, upgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v2
      - run: sudo env "PATH=$PATH" bash scripts/dev-env.sh
      # kilnd init writes the guest agent the binary carries, so the agent
      # is built first.
      - run: bash scripts/build-kilninit.sh
      - run: sudo env "PATH=$PATH" go run ./cmd/kilnd init
      # Docker sets the FORWARD policy to DROP, and Kiln's chains are
      # registered later, so the guest traffic needs a rule in both
      # directions.
      - run: sudo iptables -I FORWARD 1 -i 'kiln-+' -j ACCEPT
      - run: sudo iptables -I FORWARD 1 -o 'kiln-+' -j ACCEPT
      - run: sudo env "PATH=$PATH" just gate ${{ matrix.gate }}

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The kilnd binary carries the guest agent, so the agent is built first.
      - run: bash scripts/build-kilninit.sh

      - name: Build the host binary and the client
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o kilnd ./cmd/kilnd
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            CGO_ENABLED=0 GOOS="${target%-*}" GOARCH="${target#*-}" \
              go build -trimpath -ldflags "-s -w" -o "kiln-$target" ./cmd/kiln
          done
          sha256sum kilnd kiln-* > SHA256SUMS
          cat SHA256SUMS

      - name: The binaries report this tag
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          for binary in ./kilnd ./kiln-linux-amd64; do
            got="$("$binary" version)"
            if [ "$got" != "$want" ]; then
              echo "$binary reports $got and the tag is $want" >&2
              echo "bump apispec.Version before tagging" >&2
              exit 1
            fi
          done

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-gateway:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-gateway:latest

      # A tag alone is not a release, so the first publish for a tag makes
      # one. The notes file carries the install command, which is what
      # someone needs on the day; a person edits the rest afterwards.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "$tag" --notes-file .github/release-notes.md
          gh release upload "$tag" kilnd kiln-* SHA256SUMS --clobber
