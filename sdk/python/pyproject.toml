[project]
name = "kiln-sdk"
version = "0.8.0"
description = "Isolated Linux microVMs: create, exec, fork, sleep and publish sandboxes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/alternayte/kiln"
Documentation = "https://github.com/alternayte/kiln/blob/main/sdk/llms-full.txt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln"]
