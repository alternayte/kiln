[project]
name = "kiln-sdk"
version = "0.7.0"
description = "Isolated Linux microVMs: create, exec, fork, sleep and publish sandboxes."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln"]
